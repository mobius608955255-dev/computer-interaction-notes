<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><meta name="description" content="山东专升本计算机交互笔记：第一章与第四章 Excel"><title>计算机交互笔记</title><style>:root {
  --ink: #28232f;
  --muted: #736d7c;
  --paper: #fffdfb;
  --cream: #f7f2ed;
  --lilac: #dfd0fa;
  --purple: #7652b8;
  --pink: #f4c8d9;
  --coral: #e98179;
  --line: #e7dfdc;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-geist-sans), "Microsoft YaHei", sans-serif;
}
button, input { font: inherit; }
a { color: inherit; text-decoration: none; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
  padding: 0 max(18px, calc((100vw - 1080px) / 2));
  border-bottom: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(16px);
}
.brand { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 750; }
.brand-mark {
  display: grid; place-items: center; width: 34px; height: 34px; border-radius: 12px;
  background: var(--ink); color: white; font-size: 11px; letter-spacing: .08em;
}
.outline-link { padding: 9px 13px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 12px; }
.chapter-nav { display: flex; align-items: center; gap: 7px; }
.chapter-jump { border-color: #c9e1d7; color: #2e755e; }

.hero {
  position: relative;
  min-height: 610px;
  padding: 78px max(20px, calc((100vw - 1080px) / 2)) 58px;
  overflow: hidden;
  background:
    radial-gradient(circle at 87% 12%, rgba(244, 200, 217, .78), transparent 30%),
    linear-gradient(145deg, #f4eefc 0%, #fffafb 55%, #f8eee8 100%);
}
.hero::after {
  content: ""; position: absolute; width: 200px; height: 200px; right: -70px; bottom: -70px;
  border: 36px solid rgba(118, 82, 184, .10); border-radius: 50%;
}
.hero-orbit { position: absolute; border: 1px solid rgba(118, 82, 184, .25); border-radius: 50%; pointer-events: none; }
.orbit-one { width: 270px; height: 270px; top: 70px; right: -60px; }
.orbit-two { width: 150px; height: 150px; top: 130px; right: 0; }
.eyebrow, .kicker { margin: 0; color: var(--purple); font-size: 12px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
.hero h1 { max-width: 760px; margin: 20px 0 18px; font-size: clamp(54px, 11vw, 112px); line-height: .93; letter-spacing: -.07em; }
.hero-copy { max-width: 560px; margin: 0; color: #625b6a; font-size: clamp(17px, 2.2vw, 23px); line-height: 1.65; }
.hero-stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 32px 0; }
.hero-stats span { padding: 8px 12px; border: 1px solid rgba(118,82,184,.17); border-radius: 999px; background: rgba(255,255,255,.5); color: var(--muted); font-size: 12px; }
.hero-stats strong { color: var(--ink); }
.primary-link { display: inline-flex; align-items: center; gap: 16px; padding: 15px 18px; border-radius: 16px; background: var(--ink); color: white; font-weight: 750; font-size: 14px; box-shadow: 0 14px 35px rgba(40,35,47,.18); }
.primary-link span { color: var(--pink); font-size: 18px; }

.section-shell { width: min(100% - 36px, 1080px); margin-inline: auto; }
.catalogue { padding: 78px 0 46px; }
.section-heading { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
.section-heading h2 { margin: 3px 0 0; font-size: clamp(28px, 5vw, 44px); letter-spacing: -.045em; }
.number-chip { display: grid; place-items: center; min-width: 64px; height: 64px; border-radius: 20px; background: var(--lilac); color: #57398f; font-size: 12px; font-weight: 800; }
.catalogue-strip { display: flex; gap: 10px; overflow-x: auto; padding: 3px 3px 14px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
.catalogue-strip a { flex: 0 0 142px; min-height: 90px; padding: 15px; border: 1px solid var(--line); border-radius: 18px; background: white; color: var(--muted); font-size: 13px; line-height: 1.4; scroll-snap-align: start; }
.catalogue-strip a span { display: block; margin-bottom: 18px; color: var(--coral); font: 800 11px/1 var(--font-geist-mono), monospace; }
.catalogue-strip a.is-ready { border-color: transparent; background: var(--ink); color: white; box-shadow: 0 10px 28px rgba(40,35,47,.15); }
.catalogue-strip a.is-ready span { color: var(--pink); }

.concept { position: relative; padding: 48px 0 70px; border-top: 1px solid var(--line); }
.concept-index { position: absolute; top: 34px; right: 0; color: #efe8e5; font-size: clamp(90px, 20vw, 190px); font-weight: 900; line-height: 1; letter-spacing: -.1em; z-index: -1; }
.concept-copy { max-width: 720px; }
.concept-copy h2 { margin: 10px 0 20px; font-size: clamp(34px, 6vw, 60px); line-height: 1.06; letter-spacing: -.055em; }
.concept-copy > p:last-of-type { color: #5f5965; font-size: 17px; line-height: 1.85; }
.concept-copy strong { color: var(--ink); }
.memory-line { display: grid; gap: 7px; margin-top: 22px; padding: 18px; border-left: 4px solid var(--coral); background: var(--cream); }
.memory-line span { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .08em; }
.memory-line strong { font-size: 15px; }

.lab-card { margin-top: 30px; padding: clamp(20px, 4vw, 36px); border: 1px solid #dfd2f3; border-radius: 28px; background: linear-gradient(155deg, #f5effe, #fff 62%); box-shadow: 0 20px 50px rgba(88,62,126,.08); }
.lab-heading { display: flex; align-items: flex-start; gap: 12px; }
.lab-dot { width: 11px; height: 11px; margin-top: 6px; border: 3px solid white; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 3px var(--pink); }
.lab-heading p { margin: 0 0 4px; color: var(--coral); font-size: 11px; font-weight: 850; letter-spacing: .1em; }
.lab-heading h3 { margin: 0; font-size: clamp(20px, 4vw, 28px); }
.data-display { display: flex; align-items: baseline; justify-content: center; gap: 7px; margin: 28px 0 20px; }
.data-display strong { font-size: clamp(72px, 18vw, 128px); line-height: .85; letter-spacing: -.08em; }
.raw-label { align-self: flex-start; margin-top: 4px; padding: 6px 8px; border-radius: 8px; background: var(--ink); color: white; font-size: 10px; font-weight: 800; }
.unit { color: var(--muted); font-size: 22px; }
.slider-label { display: flex; justify-content: space-between; margin-bottom: 9px; color: var(--muted); font-size: 12px; font-weight: 700; }
.range { width: 100%; accent-color: var(--purple); cursor: pointer; }
.interpretation { margin-top: 22px; padding: 18px; border-radius: 18px; background: white; border: 1px solid var(--line); }
.interpretation span { color: var(--muted); font-size: 11px; }
.interpretation p { margin: 7px 0 0; font-size: 17px; line-height: 1.55; }
.why-note { margin: 16px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
.why-note span { margin-right: 6px; color: var(--purple); font-weight: 850; }
.note-body { color: #5f5965; font-size: 17px; line-height: 1.85; }
.note-body p { margin: 0 0 12px; }
.note-body strong { color: var(--ink); }
.concept:nth-of-type(even) .concept-index { color: #eee9f5; }
.tone-peach { border-color: #f0d9d2; background: linear-gradient(155deg, #fff1ec, #fff 62%); }
.tone-mint { border-color: #cfe7df; background: linear-gradient(155deg, #eaf8f2, #fff 62%); }
.tone-blue { border-color: #d4e0f3; background: linear-gradient(155deg, #edf4ff, #fff 62%); }

.segmented {
  display: flex;
  gap: 6px;
  margin: 24px 0 18px;
  padding: 5px;
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: rgba(255,255,255,.76);
}
.segmented button {
  flex: 1 0 auto;
  min-height: 42px;
  padding: 8px 13px;
  border: 0;
  border-radius: 11px;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  font-weight: 750;
  cursor: pointer;
}
.segmented button.active { background: var(--ink); color: white; box-shadow: 0 7px 16px rgba(40,35,47,.16); }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid rgba(118,82,184,.4); outline-offset: 3px; }

.flow-line { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; margin: 26px 0 15px; }
.flow-line button {
  position: relative; display: grid; gap: 7px; place-items: center; min-height: 70px; padding: 8px 4px;
  border: 1px solid var(--line); border-radius: 14px; background: white; color: var(--muted); font-size: 11px; cursor: pointer;
}
.flow-line button:not(:last-child)::after { content: "›"; position: absolute; right: -8px; z-index: 2; color: #a8a0ad; font-size: 18px; }
.flow-line button span { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--cream); font-size: 10px; }
.flow-line button.active { border-color: var(--purple); color: var(--purple); }
.flow-line button.active span { background: var(--purple); color: white; }
.flow-line button.passed { background: #f3eefb; color: #5d4684; }
.stage-panel { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; align-items: center; min-height: 116px; padding: 20px; border-radius: 18px; background: var(--ink); color: white; }
.stage-panel span { grid-row: 1 / 3; align-self: stretch; display: grid; place-items: center; min-width: 72px; border-radius: 12px; background: rgba(255,255,255,.11); color: var(--pink); font-size: 12px; font-weight: 800; }
.stage-panel strong { font-size: 24px; }
.stage-panel p { margin: 0; color: #c9c1cf; font-size: 13px; }

.before-after { display: grid; grid-template-columns: 1fr 110px 1fr; gap: 12px; align-items: stretch; }
.before-after > div { min-height: 126px; padding: 17px; border: 1px solid var(--line); border-radius: 18px; background: white; }
.before-after span { color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .08em; }
.before-after p { margin: 12px 0 0; font-size: 14px; line-height: 1.55; }
.before-after .signal { display: flex; flex-direction: column; justify-content: center; text-align: center; background: #dff2ea; border-color: transparent; }
.before-after .signal strong { margin-top: 8px; color: #2a7058; font-size: 17px; }

.culture-meter { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 26px 0 15px; }
.culture-meter button { min-height: 86px; border: 1px solid var(--line); border-radius: 17px; background: white; color: var(--muted); font-weight: 800; cursor: pointer; }
.culture-meter button span { display: block; margin: 0 auto 8px; color: var(--coral); font: 800 11px/1 var(--font-geist-mono), monospace; }
.culture-meter button.active { border-color: transparent; background: var(--coral); color: white; transform: translateY(-3px); box-shadow: 0 12px 24px rgba(233,129,121,.24); }
.culture-meter button.active span { color: white; }
.focus-statement { display: grid; grid-template-columns: 70px 1fr; gap: 4px 14px; align-items: center; padding: 18px; border-radius: 18px; background: var(--ink); color: white; }
.focus-statement > span { grid-row: 1 / 3; display: grid; place-items: center; align-self: stretch; border-right: 1px solid rgba(255,255,255,.15); color: var(--pink); font-size: 10px; }
.focus-statement strong { font-size: 22px; }
.focus-statement p { margin: 0; color: #c9c1cf; font-size: 13px; line-height: 1.5; }

.timeline-dots { display: flex; gap: 8px; margin: 26px 0 14px; overflow-x: auto; padding-bottom: 4px; }
.timeline-dots button { position: relative; flex: 1 0 112px; min-height: 68px; border: 1px solid var(--line); border-radius: 15px; background: white; color: var(--muted); font-size: 11px; font-weight: 800; cursor: pointer; }
.timeline-dots button span { display: block; margin-bottom: 7px; color: var(--coral); }
.timeline-dots button.active { border-color: var(--purple); color: var(--purple); box-shadow: inset 0 -4px 0 var(--purple); }
.timeline-card { padding: 22px; border-radius: 20px; background: var(--ink); color: white; }
.timeline-card > span { color: var(--pink); font-size: 11px; font-weight: 800; }
.timeline-card h4 { margin: 7px 0; font-size: 24px; }
.timeline-card p { margin: 0; color: #c9c1cf; font-size: 14px; line-height: 1.65; }

.classification-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 9px; }
.classification-grid div { min-height: 112px; padding: 18px; border: 1px solid var(--line); border-radius: 17px; background: white; }
.classification-grid strong { display: block; margin-bottom: 18px; font-size: 15px; }
.classification-grid span { color: var(--muted); font-size: 12px; line-height: 1.5; }

.application-wheel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 26px 0 14px; }
.application-wheel button { min-height: 52px; border: 1px solid var(--line); border-radius: 14px; background: white; color: var(--muted); font-size: 12px; font-weight: 800; cursor: pointer; }
.application-wheel button.active { border-color: transparent; background: #37896d; color: white; }
.application-focus { padding: 22px; border-radius: 20px; background: var(--ink); color: white; }
.application-focus > span { display: inline-block; padding: 6px 9px; border-radius: 999px; background: rgba(255,255,255,.1); color: #aee3d2; font-size: 10px; }
.application-focus strong { display: block; margin: 13px 0 5px; font-size: 25px; }
.application-focus p { margin: 0; color: #c9c1cf; font-size: 14px; }

.trend-switcher { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 26px 0 14px; }
.trend-switcher button { min-height: 90px; border: 1px solid var(--line); border-radius: 17px; background: white; color: var(--muted); font-weight: 800; cursor: pointer; }
.trend-switcher span { display: block; margin-bottom: 8px; color: var(--coral); font-size: 20px; }
.trend-switcher button.active { border-color: transparent; background: var(--coral); color: white; }
.trend-switcher button.active span { color: white; }
.trend-card { padding: 22px; border-left: 4px solid var(--coral); border-radius: 4px 18px 18px 4px; background: white; }
.trend-card strong { font-size: 23px; }
.trend-card p { margin: 9px 0 12px; color: #57515c; line-height: 1.6; }
.trend-card small { color: var(--muted); }

.number-input-label { display: block; margin: 6px 0 7px; color: var(--muted); font-size: 11px; font-weight: 800; }
.number-input { width: 100%; padding: 17px 18px; border: 2px solid var(--ink); border-radius: 16px; background: white; color: var(--ink); font: 800 24px/1 var(--font-geist-mono), monospace; letter-spacing: .06em; }
.number-input[aria-invalid="true"] { border-color: #c64747; }
.input-error { margin: 10px 0; color: #a03d3d; font-size: 12px; }
.base-results { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.base-results div { min-width: 0; padding: 14px 10px; overflow: hidden; border: 1px solid var(--line); border-radius: 15px; background: white; }
.base-results span { display: block; margin-bottom: 8px; color: var(--muted); font-size: 9px; font-weight: 850; }
.base-results strong { display: block; overflow-wrap: anywhere; font: 800 15px/1.3 var(--font-geist-mono), monospace; }

.coding-panel, .unit-ladder { padding: 20px; border: 1px solid var(--line); border-radius: 18px; background: white; }
.coding-panel > p { margin: 16px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
.ascii-display { display: grid; grid-template-columns: 80px 1fr; align-items: center; margin-top: 16px; padding: 16px; border-radius: 16px; background: var(--ink); color: white; }
.ascii-display strong { grid-row: 1 / 3; text-align: center; color: var(--pink); font-size: 50px; }
.ascii-display span { color: #cbc4d0; font-size: 11px; }
.ascii-display code { font-size: 20px; letter-spacing: .12em; }
.han-chain { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.han-chain div { position: relative; min-height: 126px; padding: 15px; border: 1px solid var(--line); border-radius: 17px; background: white; }
.han-chain div:not(:last-child)::after { content: "→"; position: absolute; right: -10px; top: 48%; z-index: 2; color: var(--purple); }
.han-chain span { display: grid; place-items: center; width: 24px; height: 24px; margin-bottom: 18px; border-radius: 50%; background: #e9e1f7; color: var(--purple); font-size: 10px; font-weight: 850; }
.han-chain strong { display: block; font-size: 14px; }
.han-chain small { display: block; margin-top: 8px; color: var(--muted); line-height: 1.4; }
.unit-focus { display: flex; align-items: baseline; justify-content: center; gap: 14px; padding: 22px; border-radius: 16px; background: var(--ink); color: white; }
.unit-focus strong { color: var(--pink); font-size: 54px; }
.unit-focus span { color: #c9c1cf; }

.machine-flow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; margin: 26px 0 14px; }
.machine-flow button { position: relative; min-height: 90px; padding: 11px 5px; border: 1px solid var(--line); border-radius: 16px; background: white; color: var(--muted); cursor: pointer; }
.machine-flow button:not(:last-child)::after { content: "›"; position: absolute; right: -7px; top: 36%; z-index: 2; color: #aba3af; font-size: 18px; }
.machine-flow button span { display: grid; place-items: center; width: 22px; height: 22px; margin: 0 auto 11px; border-radius: 50%; background: var(--cream); font-size: 9px; }
.machine-flow button strong { font-size: 11px; }
.machine-flow button.active { border-color: #37896d; color: #2b725b; }
.machine-flow button.active span { background: #37896d; color: white; }
.machine-flow button.passed { background: #e8f5f0; }
.machine-stage { padding: 22px; border-radius: 20px; background: var(--ink); color: white; }
.machine-stage span { color: #aee3d2; font-size: 10px; font-weight: 850; }
.machine-stage strong { display: block; margin: 7px 0; font-size: 25px; }
.machine-stage p { margin: 0; color: #c9c1cf; font-size: 13px; }

.power-button { display: flex; align-items: center; gap: 10px; width: 100%; margin: 25px 0 12px; padding: 14px 16px; border: 0; border-radius: 16px; font-size: 12px; font-weight: 800; cursor: pointer; }
.power-button.on { background: var(--ink); color: white; }
.power-button.off { background: #dad5d4; color: #625e61; }
.power-light { width: 11px; height: 11px; border-radius: 50%; background: #5ee0a8; box-shadow: 0 0 0 5px rgba(94,224,168,.13); }
.power-button.off .power-light { background: #999; box-shadow: none; }
.memory-stack { display: grid; gap: 7px; }
.memory-stack > div { display: grid; grid-template-columns: 108px 1fr auto; gap: 12px; align-items: center; min-height: 64px; padding: 12px 15px; border: 1px solid var(--line); border-radius: 15px; background: white; transition: opacity .2s, filter .2s; }
.memory-stack strong { font-size: 13px; }
.memory-stack span { color: var(--muted); font-size: 11px; }
.memory-stack small { padding: 5px 7px; border-radius: 999px; background: #e9f5ef; color: #2f7a61; font-size: 9px; font-weight: 800; }
.memory-stack .lost { opacity: .46; filter: grayscale(1); }
.memory-stack .lost small { background: #eee9e8; color: #8b7774; }

.software-stack { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
.software-stack > div { min-height: 88px; padding: 17px; border: 1px solid var(--line); border-radius: 16px; background: white; }
.software-stack strong { display: block; margin-bottom: 12px; font-size: 14px; }
.software-stack span { color: var(--muted); font-size: 11px; line-height: 1.45; }
.software-user-line { margin-top: 11px; padding: 17px; border-radius: 16px; background: var(--ink); color: white; }
.software-user-line span { color: var(--pink); font: 700 12px/1.5 var(--font-geist-mono), monospace; }
.software-user-line p { margin: 7px 0 0; color: #c9c1cf; font-size: 12px; }

.perf-controls { display: grid; gap: 8px; margin-top: 25px; }
.perf-controls label { display: flex; justify-content: space-between; margin-top: 8px; color: var(--muted); font-size: 12px; font-weight: 700; }
.perf-controls label strong { color: var(--ink); }
.perf-bars { display: grid; gap: 13px; margin: 24px 0 18px; }
.perf-bars div { position: relative; height: 38px; overflow: hidden; border-radius: 12px; background: white; border: 1px solid var(--line); }
.perf-bars span { position: absolute; left: 12px; top: 11px; z-index: 2; color: #39333e; font-size: 10px; font-weight: 850; }
.perf-bars i { display: block; height: 100%; background: linear-gradient(90deg, var(--lilac), var(--pink)); transition: width .2s; }
.perf-conclusion { min-height: 56px; margin: 0; padding: 15px; border-left: 4px solid var(--purple); background: white; color: #56505a; font-size: 12px; line-height: 1.55; }

.device-board { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin: 26px 0 12px; padding: 14px; border: 1px solid #bcded2; border-radius: 22px; background: #dff1e9; }
.board-lines { position: absolute; inset: 22% 10%; border: 1px dashed rgba(55,137,109,.35); border-radius: 16px; pointer-events: none; }
.device-board button { position: relative; min-height: 82px; border: 1px solid rgba(55,137,109,.23); border-radius: 15px; background: rgba(255,255,255,.88); color: #41685b; font-size: 11px; font-weight: 800; cursor: pointer; }
.device-board button span { display: grid; place-items: center; width: 21px; height: 21px; margin: 0 auto 8px; border-radius: 7px; background: #e4f4ed; font-size: 9px; }
.device-board button.active { background: #2f765f; color: white; transform: translateY(-2px); box-shadow: 0 8px 18px rgba(47,118,95,.2); }
.device-board button.active span { background: rgba(255,255,255,.16); }
.device-focus { display: grid; grid-template-columns: 92px 1fr; gap: 5px 15px; align-items: center; min-height: 105px; padding: 19px; border-radius: 18px; background: var(--ink); color: white; }
.device-focus > span { grid-row: 1 / 3; display: grid; place-items: center; align-self: stretch; border-radius: 12px; background: rgba(255,255,255,.09); color: #aee3d2; font-size: 10px; font-weight: 850; }
.device-focus strong { font-size: 22px; }
.device-focus p { margin: 0; color: #c9c1cf; font-size: 12px; line-height: 1.5; }

.footer { margin-top: 20px; padding: 74px 0 28px; background: var(--ink); color: white; }
.footer-inner { display: flex; align-items: flex-end; justify-content: space-between; gap: 30px; padding-bottom: 60px; }
.footer-inner span { color: var(--pink); font-size: 11px; font-weight: 850; letter-spacing: .1em; }

.source-note p { margin: 0; }
.source-note a { color: #e8d8f2; text-decoration: underline; text-underline-offset: 3px; }

/* 第四章 · Excel */
.excel-page { --excel: #19734e; --excel-soft: #dff2e8; --excel-line: #c9e2d5; }
.excel-mark { background: var(--excel); }

.excel-hero h1 span { color: var(--excel); }

.excel-primary { background: var(--excel); }
.excel-chip { background: var(--excel-soft); color: var(--excel); }
.excel-concept .kicker { color: var(--excel); }
.excel-concept .memory-line { border-color: var(--excel); }
.excel-lab { border-color: var(--excel-line); background: linear-gradient(155deg, #eaf8f0, #fff 62%); }
.excel-lab .lab-dot { background: var(--excel); box-shadow: 0 0 0 3px #bde3cf; }
.excel-lab .lab-heading p { color: var(--excel); }
.excel-window { display: grid; grid-template-columns: 112px 1fr; gap: 7px; margin: 24px 0 12px; padding: 10px; border: 1px solid #aab5af; border-radius: 15px; background: #f4f6f5; }
.excel-window button { min-height: 44px; border: 1px solid #cfd7d3; border-radius: 8px; background: white; color: #5a6660; text-align: left; font-size: 11px; cursor: pointer; }
.excel-window button.active { border-color: var(--excel); box-shadow: 0 0 0 3px rgba(25,115,78,.14); color: var(--excel); }
.excel-window .wide { grid-column: 2; }
.excel-window .workspace { grid-column: 1 / -1; display: grid; grid-template-columns: 34px repeat(3, 1fr); grid-template-rows: 26px repeat(2, 46px); gap: 1px; padding: 0; overflow: hidden; background: #cfd7d3; }
.excel-window .workspace span, .excel-window .workspace i { display: grid; place-items: center; background: white; font-style: normal; }
.excel-window .tabs { grid-column: 1 / -1; }
.excel-callout { padding: 18px; border-radius: 16px; background: #16382c; color: white; }
.excel-callout p { margin: 6px 0 0; color: #c6ddd3; font-size: 13px; line-height: 1.55; }
.workbook-demo { margin-top: 24px; overflow: hidden; border: 1px solid var(--excel-line); border-radius: 18px; background: white; }
.workbook-title { padding: 13px 16px; background: var(--excel); color: white; font-weight: 800; }
.workbook-title span { float: right; color: #bce2d0; font-size: 10px; }
.sheet-canvas { min-height: 150px; padding: 28px; background-image: linear-gradient(#e8eeeb 1px, transparent 1px), linear-gradient(90deg, #e8eeeb 1px, transparent 1px); background-size: 72px 34px; }
.sheet-canvas strong { display: inline-block; padding: 7px 10px; background: white; color: var(--excel); }
.sheet-canvas p { max-width: 320px; padding: 8px 10px; background: rgba(255,255,255,.92); color: var(--muted); font-size: 12px; }
.sheet-tabs { display: flex; gap: 5px; padding: 8px; background: #edf2ef; }
.sheet-tabs button { min-height: 38px; padding: 7px 16px; border: 0; border-radius: 8px; background: transparent; color: #637069; cursor: pointer; }
.sheet-tabs button.active { background: white; color: var(--excel); box-shadow: 0 3px 9px rgba(30,79,58,.12); }
.excel-page button, .excel-page select, .excel-page textarea { font: inherit; }
.cell-grid { display: grid; grid-template-columns: 38px repeat(3, 1fr); gap: 1px; margin-top: 18px; overflow: hidden; border: 1px solid #cbd8d1; border-radius: 14px; background: #cbd8d1; }
.cell-grid span { display: grid; place-items: center; min-height: 50px; background: white; color: var(--muted); font-size: 12px; }
.cell-grid span:nth-child(-n+4), .cell-grid span:nth-child(4n+1) { background: #edf3f0; color: #50645a; font-weight: 800; }
.cell-grid span.selected { background: #ccebdc; box-shadow: inset 0 0 0 2px var(--excel); }
.sheet-action-bar { display: flex; flex-wrap: wrap; gap: 7px; margin: 22px 0 12px; }
.sheet-action-bar button { min-height: 42px; padding: 9px 14px; border: 1px solid var(--excel-line); border-radius: 12px; background: white; color: #35604d; font-weight: 750; cursor: pointer; }
.live-tabs { margin-bottom: 12px; }
.live-tabs span { padding: 10px 16px; border-radius: 8px; color: #637069; font-size: 12px; }
.live-tabs span.active { background: white; color: var(--excel); box-shadow: 0 3px 9px rgba(30,79,58,.12); }

.two-controls input, .three-controls select { min-width: 0; width: 100%; min-height: 44px; padding: 8px 11px; border: 1px solid var(--excel-line); border-radius: 11px; background: white; color: var(--ink); }
.two-controls.sliders label { padding: 14px; border-radius: 13px; background: rgba(255,255,255,.76); }
.two-controls.sliders input { padding: 0; accent-color: var(--excel); }
.fill-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin: 12px 0; }
.fill-row span { display: grid; place-items: center; min-height: 58px; padding: 5px; border: 1px solid var(--excel-line); background: white; color: #3a6352; font-size: 12px; overflow-wrap: anywhere; }
.fill-row span:first-child { box-shadow: inset 0 0 0 2px var(--excel); }
.toggle-card { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; width: 100%; margin: 14px 0; padding: 16px; border: 1px solid var(--excel-line); border-radius: 15px; background: white; color: var(--muted); text-align: left; cursor: pointer; }
.toggle-card span { font-size: 12px; }

.toggle-card.warn { border-color: #e8c7a3; background: #fff6e9; }
.align-left { justify-self: start; }
.align-right { justify-self: end; }
.resize-table { display: grid; gap: 1px; max-width: 100%; overflow-x: auto; border: 1px solid #cad6d0; background: #cad6d0; }

.formula-input { font-size: clamp(15px, 3vw, 22px); letter-spacing: 0; }

.mini-table span { min-width: 78px; padding: 11px 9px; background: white; color: #526158; font-size: 11px; overflow-wrap: anywhere; }

.function-picker { display: flex; gap: 6px; margin: 20px 0 12px; overflow-x: auto; padding-bottom: 5px; }
.function-picker button { flex: none; min-height: 38px; padding: 7px 10px; border: 1px solid var(--excel-line); border-radius: 10px; background: white; color: #557064; font: 750 10px/1 var(--font-geist-mono), monospace; cursor: pointer; }
.function-picker button.active { border-color: var(--excel); background: var(--excel); color: white; }
.formula-result { display: grid; grid-template-columns: 1fr auto; gap: 8px 18px; align-items: center; padding: 18px; border-radius: 16px; background: #17392d; color: white; }
.formula-result code { color: #c1ead7; font-size: 12px; overflow-wrap: anywhere; }
.formula-result strong { color: white; font-size: 28px; }
.formula-result p { grid-column: 1 / -1; margin: 0; color: #bed1c8; font-size: 12px; }
.comment-demo { position: relative; display: grid; place-items: center; min-height: 190px; margin-top: 20px; border-radius: 18px; background-image: linear-gradient(#e6eee9 1px, transparent 1px), linear-gradient(90deg, #e6eee9 1px, transparent 1px); background-size: 78px 42px; }
.comment-cell { position: relative; width: 120px; height: 58px; border: 2px solid var(--excel); background: white; color: var(--ink); cursor: pointer; }
.comment-cell i { position: absolute; top: 0; right: 0; width: 0; height: 0; border-top: 12px solid #cf564d; border-left: 12px solid transparent; }
.comment-pop { position: absolute; left: calc(50% + 50px); top: 24px; width: min(230px, 55%); padding: 13px; border: 1px solid #e4c26c; background: #fff8d9; box-shadow: 0 9px 24px rgba(75,59,18,.16); }
.comment-pop strong { display: block; margin-bottom: 8px; font-size: 11px; }
.comment-pop textarea { width: 100%; min-height: 70px; resize: vertical; border: 0; background: transparent; color: #5d542d; font-size: 12px; }
.format-cell { display: grid; gap: 12px; place-items: center; min-height: 130px; border: 1px solid var(--excel-line); border-radius: 17px; background: white; }
.format-cell span { color: var(--muted); font: 11px/1 var(--font-geist-mono), monospace; }
.format-cell strong { font-size: clamp(28px, 7vw, 50px); }
.style-switch { width: 100%; min-height: 44px; margin: 14px 0; border: 1px solid var(--excel-line); border-radius: 12px; background: white; color: #52675d; font-size: 12px; font-weight: 800; cursor: pointer; }
.style-switch.active { border-color: var(--excel); background: var(--excel); color: white; }
.condition-table { display: grid; gap: 5px; }
.condition-table > div { display: grid; grid-template-columns: 1fr 70px 90px; padding: 11px; border: 1px solid var(--excel-line); background: white; color: var(--muted); font-size: 12px; }
.condition-table.styled > div:nth-child(even) { background: #eff7f3; }
.condition-table > div.matched { border-color: #dc8d65; background: #fff0e6; color: #8b4726; font-weight: 800; }
.list-demo { margin-top: 14px; overflow: hidden; border: 1px solid var(--excel-line); border-radius: 15px; }
.list-row { display: grid; grid-template-columns: repeat(3,1fr); background: white; }
.list-row span { min-height: 42px; padding: 12px; border-right: 1px solid var(--excel-line); border-bottom: 1px solid var(--excel-line); color: var(--muted); font-size: 11px; }
.list-row.head span { background: var(--excel); color: white; font-weight: 800; }
.list-row.blank span { background: repeating-linear-gradient(135deg,#fff,#fff 8px,#f7e9e4 8px,#f7e9e4 16px); }
.three-controls select { font-size: 11px; }
.subtotal-list { display: grid; gap: 5px; }
.subtotal-list > div { display: grid; grid-template-columns: 80px 1fr 70px; gap: 6px; padding: 10px 12px; border: 1px solid var(--excel-line); border-radius: 10px; background: white; color: var(--muted); font-size: 11px; }
.subtotal-list em { grid-column: 1 / -1; padding-top: 8px; border-top: 1px dashed var(--excel-line); color: var(--excel); font-style: normal; font-weight: 850; text-align: right; }
.pivot-builder { display: grid; grid-template-columns: repeat(2,1fr); gap: 9px; margin: 20px 0; }
.pivot-builder > div { display: flex; flex-wrap: wrap; gap: 6px; min-height: 110px; padding: 13px; border: 1px dashed #9bc7b2; border-radius: 14px; background: rgba(255,255,255,.7); }
.pivot-builder span { flex-basis: 100%; color: var(--muted); font-size: 10px; font-weight: 800; }
.pivot-builder button { flex: 1; min-width: 70px; border: 1px solid var(--excel-line); border-radius: 9px; background: white; color: #5e7469; font-size: 11px; cursor: pointer; }
.pivot-builder button.active { background: var(--excel); color: white; }
.goal-result { display: grid; gap: 7px; place-items: center; margin: 16px 0; padding: 22px; border-radius: 17px; background: #17392d; color: white; }
.goal-result span { color: #bdd5ca; font-size: 11px; }
.goal-result strong { font-size: clamp(22px,5vw,36px); }
.operation-stage { min-height: 160px; padding: 24px; border-radius: 18px; background: white; border: 1px solid var(--excel-line); }
.operation-stage code { display: block; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.operation-stage strong { display: block; margin: 22px 0 7px; color: var(--excel); font-size: clamp(18px,4vw,28px); }
.operation-stage p { margin: 0; color: var(--muted); font-size: 12px; }
.chart-gallery { display: grid; grid-template-columns: minmax(190px, .8fr) 1fr; gap: 24px; align-items: center; padding: 22px; border-radius: 18px; background: white; }
.chart-gallery p { color: var(--muted); font-size: 12px; line-height: 1.55; }
.chart-shape { display: flex; align-items: flex-end; justify-content: center; gap: 10px; height: 150px; padding: 20px; border-left: 1px solid #aebbb5; border-bottom: 1px solid #aebbb5; }
.chart-shape i { display: block; width: 28px; background: var(--excel); }
.chart-shape i:nth-child(1) { height: 35%; }.chart-shape i:nth-child(2) { height: 72%; }.chart-shape i:nth-child(3) { height: 52%; }.chart-shape i:nth-child(4) { height: 88%; }
.type-1 .chart-shape { align-items: stretch; flex-direction: column; border: 0; transform: rotate(-5deg); }
.type-1 .chart-shape i { width: 70%; height: 3px !important; transform-origin: left; }.type-1 .chart-shape i:nth-child(2) { transform: translateX(18px); }.type-1 .chart-shape i:nth-child(4) { transform: translateX(38px); }
.type-2 .chart-shape { border: 24px solid #91d1b4; border-right-color: #dba17e; border-radius: 50%; width: 150px; margin: auto; }
.type-2 .chart-shape i { display: none; }
.type-3 .chart-shape { display: grid; grid-template-columns: repeat(2,1fr); place-items: center; border: 0; }
.type-3 .chart-shape i { width: 14px; height: 14px !important; border-radius: 50%; }.type-3 .chart-shape i:nth-child(2) { transform: translate(26px,-22px); }.type-3 .chart-shape i:nth-child(3) { transform: translate(-18px,20px); }
.combo-chart { position: relative; height: 250px; margin-top: 14px; padding: 30px 24px 34px; overflow: hidden; border-left: 1px solid #9ca9a2; border-bottom: 1px solid #9ca9a2; background: repeating-linear-gradient(0deg,white,white 47px,#edf1ef 48px); }
.combo-chart .bars { display: flex; align-items: flex-end; justify-content: space-around; height: 100%; }
.combo-chart .bars i { width: 13%; background: #69af90; }
.rate-line { position: absolute; inset: 34px 32px 45px; display: flex; align-items: flex-end; justify-content: space-around; pointer-events: none; }
.rate-line span { width: 12px; height: 12px; border: 3px solid #d46c57; border-radius: 50%; background: white; }
.rate-line span:nth-child(1) { margin-bottom: 25%; }.rate-line span:nth-child(2) { margin-bottom: 46%; }.rate-line span:nth-child(3) { margin-bottom: 68%; }.rate-line span:nth-child(4) { margin-bottom: 38%; }
.rate-line.flat span { margin-bottom: 2%; }
.combo-chart small { position: absolute; bottom: 8px; left: 20px; color: var(--muted); }
.spark-row { display: grid; grid-template-columns: 70px repeat(4,45px) minmax(130px,1fr); gap: 3px; align-items: center; margin-top: 20px; overflow-x: auto; }
.spark-row > span, .spark-row > em { padding: 10px 7px; background: white; color: var(--muted); font-size: 11px; font-style: normal; }
.spark { display: flex; align-items: flex-end; justify-content: space-around; height: 74px; padding: 10px; background: white; border: 1px solid var(--excel-line); }
.spark i { width: 11px; max-height: 90%; background: var(--excel); }
.spark-0 i { width: 18%; height: 3px !important; transform: rotate(-8deg); }.spark-0 i:nth-child(2) { transform: translateY(-16px) rotate(10deg); }.spark-0 i:nth-child(4) { transform: translateY(-24px) rotate(-8deg); }
.spark-2 i { background: #d27a66; }.spark-2 i:nth-child(n+2) { background: var(--excel); }
.print-preview { width: 260px; min-height: 340px; margin: 20px auto 0; padding: 24px; border: 1px solid #cfd8d3; background: white; box-shadow: 0 15px 35px rgba(38,59,49,.12); transform-origin: top center; transition: .2s; }
.print-preview.landscape { width: min(100%,420px); min-height: 270px; }
.print-preview .print-head { padding: 9px; border-bottom: 2px solid var(--excel); color: var(--excel); font-size: 10px; font-weight: 850; }
.print-preview p { padding: 8px; border-bottom: 1px solid #e7ece9; color: var(--muted); font-size: 10px; }
.excel-footer { margin-top: 20px; }
.excel-footer .footer-inner span, .excel-footer .source-note a { color: #bfe8d5; }

@media (max-width: 640px) {

  .hero-copy { max-width: 340px; }
  .orbit-one { right: -165px; top: 48px; }
  .orbit-two { right: -94px; top: 108px; }
  .catalogue { padding-top: 58px; }
  .section-heading { align-items: flex-start; }
  .number-chip { min-width: 54px; height: 54px; border-radius: 17px; }
  .concept { padding-top: 38px; }
  .concept-index { top: 28px; right: 5px; }
  .concept-copy > p:last-of-type { font-size: 16px; line-height: 1.78; }
  .lab-card { border-radius: 22px; }
  .note-body { font-size: 16px; line-height: 1.78; }
  .flow-line, .machine-flow { grid-template-columns: repeat(5, minmax(62px, 1fr)); overflow-x: auto; padding-bottom: 5px; }
  .stage-panel { grid-template-columns: 68px 1fr; }
  .before-after { grid-template-columns: 1fr; }

  .culture-meter { grid-template-columns: repeat(2, 1fr); }
  .classification-grid, .software-stack { grid-template-columns: 1fr; }
  .application-wheel { grid-template-columns: repeat(2, 1fr); }
  .trend-switcher { grid-template-columns: repeat(2, 1fr); }
  .base-results { grid-template-columns: repeat(2, 1fr); }
  .han-chain { grid-template-columns: repeat(2, 1fr); }
  .han-chain div:not(:last-child)::after { display: none; }
  .memory-stack > div { grid-template-columns: 82px 1fr; }
  .memory-stack small { grid-column: 2; justify-self: start; }

  .footer-inner { display: grid; }
  .footer-inner > a { justify-self: start; }

}

@media (prefers-reduced-motion: reduce) {
