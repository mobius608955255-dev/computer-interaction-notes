<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f4f7">
  <meta name="color-scheme" content="light">
  <meta name="description" content="山东专升本计算机真题逐题反推知识点，按教材11章归档，并以现行考纲、Office 2016和标准概念校正。">
  <meta property="og:type" content="website"><meta property="og:locale" content="zh_CN"><meta property="og:title" content="山东专升本计算机真题来源笔记"><meta property="og:description" content="每道真题提炼一则笔记，按教材章节整理，不保留过时答案。"><meta property="og:image" content="https://mobius608955255-dev.github.io/computer-interaction-notes/og.png">
  <link rel="canonical" href="https://mobius608955255-dev.github.io/computer-interaction-notes/">
  <title>山东专升本计算机真题来源笔记</title>
  <script>(function(){var q=new URLSearchParams(location.search),c=Number(q.get('chapter')),y=q.get('year')||'2026';if(c>=1&&c<=11){location.replace('./chapter'+c+'.html?v=12&year='+y+'#chapter-top');}})();</script>
  <link rel="stylesheet" href="./notes-2020.css?v=12">
</head>
<body class="home-page">
  <header class="site-header">
    <a class="brand" id="home-brand" href="./index.html?v=12&year=2026"><span class="brand-mark" id="brand-year">26</span><span class="brand-copy"><strong>计算机系统笔记</strong><small id="brand-source">2026真题来源</small></span></a>
    <div class="header-actions"><label class="year-select-wrap"><span class="sr-only">切换真题年份</span><select id="year-select" aria-label="切换真题年份"><option value="2026">2026年</option><option value="2020">2020年</option></select></label><a class="official-link" href="https://www.sdzk.cn/NewsInfo.aspx?BCID=1195&amp;CID=1133&amp;NewsID=7081" target="_blank" rel="noreferrer">现行考试要求</a></div>
  </header>
  <main class="home-main">
    <section class="home-intro">
      <p class="chapter-kicker" id="home-kicker"></p>
      <h1>从真题出发，<br>整理成笔记。</h1>
      <p>每一道题只作为发现知识点的线索，再按教材目录归入对应章节。软件内容统一采用 Office 2016，其他内容采用现行考纲或标准概念，不保留过时答案。</p>
      <div class="chapter-meta"><span id="question-total"></span><span>教材11章结构</span></div>
    </section>
    <section class="home-catalogue" aria-labelledby="catalogue-title">
      <div class="catalogue-heading"><p id="catalogue-year"></p><h2 id="catalogue-title">选择章节</h2></div>
      <div class="home-chapters" id="chapter-grid"></div>
      <noscript>请启用JavaScript查看章节目录。</noscript>
    </section>
  </main>
  <footer class="site-footer"><a id="start-link" href="./chapter1.html?v=12&year=2026">从第一章开始</a></footer>
  <script src="./notes-2020-data.js?v=12"></script>
  <script src="./notes-2026-data.js?v=12"></script>
  <script>
    (function(){
      var datasets={2020:window.NOTES2020,2026:window.NOTES2026},q=new URLSearchParams(location.search),requested=Number(q.get('year')),year=datasets[requested]?requested:2026,d=datasets[year],g=document.getElementById('chapter-grid');
      document.getElementById('year-select').value=String(year);
      document.getElementById('brand-year').textContent=String(year).slice(-2);
      document.getElementById('brand-source').textContent=year+'真题来源';
      document.getElementById('home-brand').href='./index.html?v=12&year='+year;
      document.getElementById('home-kicker').textContent=year+' SHANDONG EXAM · '+d.notes.length+' QUESTIONS';
      document.getElementById('question-total').textContent=d.notes.length+'道题逐题覆盖';
      document.getElementById('catalogue-year').textContent=year+'年真题 · 教材目录';
      document.getElementById('start-link').href='./chapter1.html?v=12&year='+year;
      g.innerHTML=d.chapters.map(function(c){var n=d.notes.filter(function(x){return x.chapter===c.number}).length;return '<a class="home-chapter" href="./chapter'+c.number+'.html?v=12&year='+year+'"><span class="home-number">'+String(c.number).padStart(2,'0')+'</span><span class="home-copy"><strong>'+c.title+'</strong><small>'+c.sections.map(function(s){return s.id+' '+s.title}).join(' · ')+'</small></span><span class="home-count">'+(n?n+'题':'本年未命中')+'</span></a>';}).join('');
      document.getElementById('year-select').addEventListener('change',function(event){location.href='./index.html?v=12&year='+event.target.value;});
    })();
  </script>
</body>
</html>
