name: Inject exam enhancements

on:
  push:
    paths:
      - 'enhancements-v3.js'
      - 'enhancements-v3.css'
      - 'enhancements-v3-bootstrap.js'
      - 'enhancements-v6.js'
      - 'enhancements-v6.css'
      - 'enhancements-v7.js'
      - 'enhancements-v7.css'
      - 'enhancements-v8.js'
      - 'enhancements-v8.css'
      - '.github/workflows/inject-enhancements.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject enhancement assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          assets = [
              ('</head>', '<link rel="stylesheet" href="./enhancements-v3.css?v=3">'),
              ('</head>', '<link rel="stylesheet" href="./enhancements-v6.css?v=6">'),
              ('</head>', '<link rel="stylesheet" href="./enhancements-v7.css?v=7">'),
              ('</head>', '<link rel="stylesheet" href="./enhancements-v8.css?v=8">'),
              ('</body>', '<script src="./enhancements-v3.js?v=3"></script>'),
              ('</body>', '<script src="./enhancements-v3-bootstrap.js?v=3"></script>'),
              ('</body>', '<script src="./enhancements-v6.js?v=6"></script>'),
              ('</body>', '<script src="./enhancements-v7.js?v=7"></script>'),
              ('</body>', '<script src="./enhancements-v8.js?v=8"></script>'),
          ]
          changed = False
          for marker, asset in assets:
              if asset in s:
                  continue
              if marker not in s:
                  raise SystemExit(f'missing {marker}')
              s = s.replace(marker, asset + marker, 1)
              changed = True
          if changed:
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit injected index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Inject exam-driven enhancement assets'
          git push
