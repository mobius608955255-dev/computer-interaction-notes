<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>笔记布局检查</title>
<style>body{margin:0;background:#dde4df;font:14px/1.5 system-ui,sans-serif;color:#274333}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}select,button{font:inherit;padding:7px}iframe{display:block;border:1px solid #899f91;margin:0 auto;background:white;height:82vh;max-width:100%}output{padding:10px;display:block}label{display:flex;gap:7px;align-items:center}</style></head>
<body><header><label>窗口宽度<select id="width"><option>390</option><option>360</option><option>760</option><option>1200</option></select></label><label>章节<select id="chapter"></select></label><label>演示<select id="note"></select></label><button id="open">打开并定位演示</button><button id="measure">测量溢出</button></header><iframe id="preview" title="窄屏笔记预览" width="390"></iframe><output id="result" aria-live="polite"></output>
<script>
const frame=document.getElementById('preview'),width=document.getElementById('width'),chapter=document.getElementById('chapter'),note=document.getElementById('note');
chapter.innerHTML=Array.from({length:11},(_,i)=>`<option value="${i+1}">第${i+1}章</option>`).join('');
chapter.value='4';
function load(){frame.src=`../chapter${chapter.value}.html?v=25`;}
chapter.onchange=load;width.onchange=()=>frame.width=width.value;
frame.onload=()=>{note.innerHTML=[...frame.contentDocument.querySelectorAll('.note-item')].map(n=>`<option value="${n.id}">${n.querySelector('h3').textContent}</option>`).join('');};
document.getElementById('open').onclick=()=>{const c=frame.contentDocument.getElementById(note.value);if(!c)return;const b=c.querySelector('.simulation-toggle');if(b.getAttribute('aria-expanded')==='false')b.click();b.scrollIntoView({block:'start'});};
document.getElementById('measure').onclick=()=>{const d=frame.contentDocument;const c=d.getElementById(note.value);const r=c.querySelector('.reality-demo').getBoundingClientRect();document.getElementById('result').textContent=`视口 ${d.documentElement.clientWidth}px / 文档 ${d.documentElement.scrollWidth}px / 卡片 ${Math.round(r.width)}px；正文横向溢出 ${Math.max(0,d.documentElement.scrollWidth-d.documentElement.clientWidth)}px`;};
load();
</script></body></html>
