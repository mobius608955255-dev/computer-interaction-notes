name: Inject exam enhancements

on:
  push:
    paths:
      - 'enhancements-v3.js'
      - 'enhancements-v3.css'
      - 'enhancements-v3-bootstrap.js'
      - 'enhancements-v6.js'
      - 'enhancements-v6.css'
      - 'enhancements-v7.js'
      - 'enhancements-v7.css'
      - 'enhancements-v8.js'
      - 'enhancements-v8.css'
      - 'enhancements-v9.js'
      - 'enhancements-v9.css'
      - 'enhancements-v10.js'
      - 'enhancements-v10.css'
      - 'enhancements-v11.js'
      - 'enhancements-v11.css'
      - 'enhancements-v12.js'
      - 'enhancements-v12.css'
      - 'enhancements-v13.js'
      - 'enhancements-v14.js'
      - 'enhancements-v15.js'
      - 'enhancements-v16.js'
      - 'enhancements-v17.js'
      - 'enhancements-v18.js'
      - 'enhancements-v19.js'
      - 'enhancements-v20.js'
      - 'enhancements-v21.js'
      - 'enhancements-v22.js'
      - 'enhancements-v23.js'
      - 'enhancements-v24.js'
      - 'enhancements-v25.js'
      - 'enhancements-v26.js'
      - '.github/workflows/inject-enhancements.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject enhancement assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Keep the static/share description aligned with the actual product: notes first, not exercises.
          s = s.replace('山东专升本计算机交互笔记：真题驱动、交互练习、随学随测',
                        '山东专升本计算机互动笔记：概念讲解、核心规则、操作演示、真题校验与易错点整理。')
          s = s.replace('真题驱动 · 交互练习 · 随学随测',
                        '概念讲解 · 核心规则 · 操作演示 · 真题校验')

          # Hierarchy audit: deterministic directory names + normalized single-page order.
          for old in ('7', '8'):
              s = s.replace(f'<script src="./enhancements-v7.js?v={old}"></script>',
                            '<script src="./enhancements-v7.js?v=9"></script>')
          s = s.replace('<script src="./enhancements-v8.js?v=9"></script>',
                        '<script src="./enhancements-v8.js?v=10"></script>')

          # v24 consolidates duplicate notes and now also splits the unrelated OOP / queue concepts.
          for old in ('25', '26', '27'):
              s = s.replace(f'<script src="./enhancements-v24.js?v={old}"></script>',
                            '<script src="./enhancements-v24.js?v=28"></script>')

          # v26 was expanded during the final syllabus audit; force browsers off the first cached copy.
          s = s.replace('<script src="./enhancements-v26.js?v=30"></script>',
                        '<script src="./enhancements-v26.js?v=31"></script>')

          assets = [
              ('</head>', '<link rel="stylesheet" href="./enhancements-v3.css?v=3">'),
              ('</head>', '<link rel="stylesheet" href="./enhancements-v6.css?v=6">'),
              ('</head>', '<link rel="stylesheet" href="./enhancements-v7.css?v=7">'),
              ('</head>', '<link rel="stylesheet" href="./enhancements-v8.css?v=9">'),
              ('</head>', '<link rel="stylesheet" href="./enhancements-v9.css?v=10">'),
              ('</head>', '<link rel="stylesheet" href="./enhancements-v10.css?v=11">'),
              ('</head>', '<link rel="stylesheet" href="./enhancements-v11.css?v=12">'),
              ('</head>', '<link rel="stylesheet" href="./enhancements-v12.css?v=13">'),
              ('</body>', '<script src="./enhancements-v3.js?v=3"></script>'),
              ('</body>', '<script src="./enhancements-v3-bootstrap.js?v=3"></script>'),
              ('</body>', '<script src="./enhancements-v6.js?v=6"></script>'),
              ('</body>', '<script src="./enhancements-v7.js?v=9"></script>'),
              ('</body>', '<script src="./enhancements-v8.js?v=10"></script>'),
              ('</body>', '<script src="./enhancements-v9.js?v=10"></script>'),
              ('</body>', '<script src="./enhancements-v10.js?v=11"></script>'),
              ('</body>', '<script src="./enhancements-v11.js?v=12"></script>'),
              ('</body>', '<script src="./enhancements-v12.js?v=13"></script>'),
              ('</body>', '<script src="./enhancements-v13.js?v=14"></script>'),
              ('</body>', '<script src="./enhancements-v14.js?v=15"></script>'),
              ('</body>', '<script src="./enhancements-v15.js?v=16"></script>'),
              ('</body>', '<script src="./enhancements-v16.js?v=17"></script>'),
              ('</body>', '<script src="./enhancements-v17.js?v=18"></script>'),
              ('</body>', '<script src="./enhancements-v18.js?v=19"></script>'),
              ('</body>', '<script src="./enhancements-v19.js?v=20"></script>'),
              ('</body>', '<script src="./enhancements-v20.js?v=21"></script>'),
              ('</body>', '<script src="./enhancements-v21.js?v=22"></script>'),
              ('</body>', '<script src="./enhancements-v22.js?v=23"></script>'),
              ('</body>', '<script src="./enhancements-v23.js?v=24"></script>'),
              ('</body>', '<script src="./enhancements-v24.js?v=28"></script>'),
              ('</body>', '<script src="./enhancements-v25.js?v=29"></script>'),
              ('</body>', '<script src="./enhancements-v26.js?v=31"></script>'),
          ]
          for marker, asset in assets:
              if asset in s:
                  continue
              if marker not in s:
                  raise SystemExit(f'missing {marker}')
              s = s.replace(marker, asset + marker, 1)

          original = p.read_text(encoding='utf-8')
          if s != original:
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit injected index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Inject concept-first notes assets'
          git push
